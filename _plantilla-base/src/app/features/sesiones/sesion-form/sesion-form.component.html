<form [formGroup]="form" (ngSubmit)="guardar()" class="flex flex-col gap-5">
    <p-message *ngIf="mensajeErrorRoles()" severity="error" [text]="mensajeErrorRoles()!" />

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
            <label for="snacionalidad" class="block text-sm font-semibold mb-1">Nacionalidad</label>
            <p-select
                inputId="snacionalidad"
                [options]="nacionalidades"
                optionLabel="label"
                optionValue="value"
                formControlName="snacionalidad"
                class="w-full"
                [style]="{ width: '100%' }" />
        </div>
        <div class="md:col-span-2">
            <label for="ncedulaIdent" class="block text-sm font-semibold mb-1">Número de documento</label>
            <input
                id="ncedulaIdent"
                pInputText
                type="text"
                formControlName="ncedulaIdent"
                class="w-full"
                maxlength="9"
                inputmode="numeric"
                placeholder="Ej. 12345678"
                (input)="filtrarSoloNumeros($event)" />
            <small *ngIf="form.get('ncedulaIdent')?.invalid && form.get('ncedulaIdent')?.touched" class="text-red-500 block mt-1">
                Ingresa un documento válido.
            </small>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label for="sprimerNombre" class="block text-sm font-semibold mb-1">Primer nombre</label>
            <input id="sprimerNombre" pInputText formControlName="sprimerNombre" class="w-full" maxlength="100" />
            <small *ngIf="form.get('sprimerNombre')?.invalid && form.get('sprimerNombre')?.touched" class="text-red-500 block mt-1">
                El primer nombre es obligatorio.
            </small>
        </div>
        <div>
            <label for="ssegundoNombre" class="block text-sm font-semibold mb-1">Segundo nombre (opcional)</label>
            <input id="ssegundoNombre" pInputText formControlName="ssegundoNombre" class="w-full" maxlength="100" />
        </div>
        <div>
            <label for="sprimerApellido" class="block text-sm font-semibold mb-1">Primer apellido</label>
            <input id="sprimerApellido" pInputText formControlName="sprimerApellido" class="w-full" maxlength="100" />
            <small *ngIf="form.get('sprimerApellido')?.invalid && form.get('sprimerApellido')?.touched" class="text-red-500 block mt-1">
                El primer apellido es obligatorio.
            </small>
        </div>
        <div>
            <label for="ssegundoApellido" class="block text-sm font-semibold mb-1">Segundo apellido (opcional)</label>
            <input id="ssegundoApellido" pInputText formControlName="ssegundoApellido" class="w-full" maxlength="100" />
        </div>
    </div>

    <section *ngIf="modo === 'alta'" class="p-4 bg-surface-50 dark:bg-surface-800/50 rounded-xl border border-surface-200 dark:border-surface-700">
        <h3 class="text-sm font-semibold mt-0 mb-4">Credenciales iniciales</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="password" class="block text-sm font-semibold mb-1">Contraseña inicial</label>
                <input id="password" pInputText type="password" formControlName="password" class="w-full" autocomplete="new-password" />
                <small *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="text-red-500 block mt-1">
                    Usa al menos 6 caracteres, con mayúscula, minúscula y número.
                </small>
            </div>
            <div>
                <label for="confirmPassword" class="block text-sm font-semibold mb-1">Confirmar contraseña</label>
                <input id="confirmPassword" pInputText type="password" formControlName="confirmPassword" class="w-full" autocomplete="new-password" />
                <small *ngIf="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched" class="text-red-500 block mt-1">
                    Las contraseñas no coinciden.
                </small>
            </div>
        </div>
    </section>

    <div>
        <label for="rolId" class="block text-sm font-semibold mb-1">Rol</label>
        <p-select
            inputId="rolId"
            [options]="roles()"
            optionLabel="sdescripcion"
            optionValue="idRol"
            formControlName="rolId"
            placeholder="Selecciona un rol"
            appendTo="body"
            class="w-full"
            [style]="{ width: '100%' }" />
        <small *ngIf="form.get('rolId')?.invalid && form.get('rolId')?.touched" class="text-red-500 block mt-1">
            Selecciona un rol activo.
        </small>
    </div>

    <div class="flex justify-end gap-3 mt-2 pt-3 border-t border-surface-200 dark:border-surface-700">
        <p-button type="button" label="Cancelar" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="onCancelar()" />
        <p-button
            type="submit"
            [label]="modo === 'alta' ? 'Crear usuario' : 'Guardar cambios'"
            [icon]="modo === 'alta' ? 'pi pi-user-plus' : 'pi pi-check'"
            [loading]="guardando()"
            [disabled]="form.invalid || guardando() || !roles().length" />
    </div>
</form>
