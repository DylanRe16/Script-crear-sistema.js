<div class="relative bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw] overflow-hidden p-4" style="background-image: url('/login-background.png'); background-position: center; background-size: cover; background-repeat: no-repeat;">
    <p-toast position="top-right" />
    <div class="pointer-events-none absolute inset-0 bg-surface-950/0 dark:bg-surface-950/80"></div>
    <div class="relative z-10 flex flex-col items-center justify-center w-full max-w-md">

        <div class="flex items-center gap-2 mb-6">
            <div class="bg-primary text-white p-3 rounded-2xl shadow-md">
                <i class="pi pi-shield text-3xl"></i>
            </div>
            <div>
                <span class="text-3xl font-extrabold text-surface-900 dark:text-surface-0 tracking-wider">Portal</span>
                <span class="block text-xs uppercase tracking-widest text-primary font-bold">Acceso a tu cuenta</span>
            </div>
        </div>

        <!-- Tarjeta de Login -->
        <div class="w-full bg-surface-0 dark:bg-surface-900 p-8 rounded-3xl shadow-xl border border-surface-200 dark:border-surface-800">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-surface-900 dark:text-surface-0 m-0">Iniciar Sesión</h2>
                <p class="text-xs text-muted-color mt-1 mb-0">Ingresa tus credenciales para continuar</p>
                <hr class="mt-3 border-surface-200 dark:border-surface-700">
            </div>

            <!-- Mensaje de error (ProblemDetails.detail) -->
            <div *ngIf="mensajeError" class="mb-4 p-3 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-300 dark:border-red-800 text-red-700 dark:text-red-300 text-xs flex items-center gap-2">
                <i class="pi pi-exclamation-circle text-red-500 text-base"></i>
                <span>{{ mensajeError }}</span>
            </div>

            <form (ngSubmit)="onLogin()" class="space-y-4">
                <!-- Fila de Nacionalidad y Número de Cédula (1 a 9 dígitos numéricos) -->
                <div>
                    <label class="block text-surface-900 dark:text-surface-0 font-medium text-sm mb-2">
                        Documento de Identidad <span class="text-red-500">*</span>
                    </label>
                    <div class="grid grid-cols-12 gap-2">
                        <div class="col-span-4">
                            <p-select
                                [options]="opcionesNacionalidad"
                                [(ngModel)]="snacionalidad"
                                name="snacionalidad"
                                optionLabel="label"
                                optionValue="value"
                                placeholder="Tipo"
                                styleClass="w-full" />
                        </div>
                        <div class="col-span-8">
                            <input
                                id="ncedulaIdent"
                                type="text"
                                pInputText
                                [(ngModel)]="ncedulaIdentStr"
                                name="ncedulaIdent"
                                (input)="onCedulaInput($event)"
                                maxlength="9"
                                inputmode="numeric"
                                pattern="[0-9]*"
                                placeholder="Ej: 100000001"
                                class="w-full"
                                required />
                        </div>
                    </div>
                    <small class="text-[11px] text-muted-color block mt-1">
                        Solo dígitos numéricos (hasta 9 dígitos).
                    </small>
                </div>

                <div>
                    <label for="password" class="block text-surface-900 dark:text-surface-0 font-medium text-sm mb-2">
                        Contraseña <span class="text-red-500">*</span>
                    </label>
                    <p-password
                        id="password"
                        [(ngModel)]="password"
                        name="password"
                        [feedback]="false"
                        [toggleMask]="true"
                        placeholder="••••••••"
                        styleClass="w-full"
                        inputStyleClass="w-full"
                        [required]="true"></p-password>
                </div>

                <div class="flex items-center justify-between text-sm pt-1">
                    <div class="flex items-center gap-2">
                        <p-checkbox id="rememberme" [(ngModel)]="checked" [binary]="true" name="rememberme"></p-checkbox>
                        <label for="rememberme" class="text-surface-700 dark:text-surface-300 cursor-pointer">Recordarme</label>
                    </div>
                    <button
                        type="button"
                        class="font-medium text-primary hover:underline cursor-pointer bg-transparent border-0 p-0"
                        (click)="abrirRecuperacion()">
                        ¿Olvidó su contraseña?
                    </button>
                </div>

                <p-button
                    type="submit"
                    label="Ingresar al Sistema"
                    icon="pi pi-sign-in"
                    severity="primary"
                    [loading]="cargando"
                    styleClass="w-full font-bold py-3 mt-2 shadow" />
            </form>

        </div>

        <div class="text-center mt-6 text-xs text-muted-color">
           © {{ currentYear }} Portal de autenticación
        </div>
    </div>

    <app-recuperar-contrasena-dialog
        [(visible)]="modalRecuperacionVisible"
        (restablecida)="onPasswordRestablecida($event)" />
</div>
