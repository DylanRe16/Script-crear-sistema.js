<div class="layout-topbar">
    <div class="layout-topbar-logo-container">
        <button class="layout-menu-button layout-topbar-action" (click)="layoutService.onMenuToggle()" aria-label="Abrir menú">
            <i class="pi pi-bars"></i>
        </button>
        <a class="layout-topbar-logo" routerLink="/app/dashboard">
            <i class="pi pi-shield text-primary text-3xl mr-2"></i>
            <span class="font-extrabold tracking-wider">Portal</span>
        </a>
    </div>

    <div class="layout-topbar-actions">
        <div *ngIf="authService.currentUser() as user" class="hidden md:flex items-center gap-2 px-3 py-1 bg-surface-100 dark:bg-surface-800 rounded-xl border border-surface-200 dark:border-surface-700 text-xs">
            <i class="pi pi-user text-primary"></i>
            <span class="font-semibold text-surface-900 dark:text-surface-0">{{ user.nombreCompleto || 'Usuario' }}</span>
            <span class="px-2 py-0.5 rounded font-bold uppercase tracking-wider text-[10px] bg-primary/10 text-primary">
                {{ user.nombreRol || 'Cuenta' }}
            </span>
        </div>

        <div class="layout-config-menu">
            <button type="button" class="layout-topbar-action" (click)="toggleDarkMode()" [attr.aria-label]="layoutService.isDarkTheme() ? 'Activar modo claro' : 'Activar modo oscuro'" [pTooltip]="layoutService.isDarkTheme() ? 'Modo claro' : 'Modo oscuro'">
                <i [ngClass]="{ 'pi ': true, 'pi-moon': layoutService.isDarkTheme(), 'pi-sun': !layoutService.isDarkTheme() }"></i>
            </button>
        </div>

        <button type="button" class="layout-topbar-action" routerLink="/app/perfil" aria-label="Perfil">
            <i class="pi pi-user"></i>
        </button>
        <button type="button" class="layout-topbar-action" (click)="authService.logout()" aria-label="Cerrar sesión">
            <i class="pi pi-sign-out"></i>
        </button>
    </div>
</div>
